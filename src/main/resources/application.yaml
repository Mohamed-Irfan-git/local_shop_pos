server:
  address: 0.0.0.0

spring:
  application:
    name: restaurant-pos-backend

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

app:
  jwt:
    secret: ${jwt.secret}
    expiration-ms: ${jwt.expiration-ms:28800000}

logging:
  level:
    com.restaurant.pos: INFO
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health